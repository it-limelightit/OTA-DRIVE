services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-limelight_ota}
      POSTGRES_USER: ${POSTGRES_USER:-limelight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-limelight-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-minio}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-limelight}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/${POSTGRES_DB:-limelight_ota}
      API_PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MQTT_URL: ${MQTT_URL}
      # Containers reach MinIO by its Compose service name. The .env endpoint
      # (localhost:9000) remains for non-Docker development mode.
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-firmware}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-limelight-dev}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio}
      S3_REGION: ${S3_REGION:-auto}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_CREATE_BUCKET: ${S3_CREATE_BUCKET:-true}
      FIRMWARE_URL_TTL_SECONDS: ${FIRMWARE_URL_TTL_SECONDS:-900}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["3000:3000"]

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  postgres-data:
  minio-data:
